<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sabor Express Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../src/styles/pages/login.css">
    <link rel="icon" href="../../assets/images/logo_ficticia.png">
</head>
<body>
    <div class="login-container">
        <header class="login-header">
            <img src="../../assets/images/logo_ficticia.png" alt="Sabor Express" style="width: 80px; height: 80px; margin-bottom: 0.5rem;">
            <h1><i class="fas fa-lock"></i> Painel de Controle</h1>
            <p>Sabor Express Delivery</p>
        </header>
        
        <form class="login-form" id="loginForm">
            <div class="error-message" id="errorMessage">
                Usuário ou senha incorretos!
            </div>
            
            <div class="form-group">
                <label for="username">Usuário:</label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="Usuário (ex: admin)" value="admin" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Senha:</label>
                <div class="input-icon">
                    <i class="fas fa-key"></i>
                    <input type="password" id="password" name="password" placeholder="Senha (ex: admin123)" value="admin123" required>
                </div>
            </div>
            
            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Entrar no Painel</span>
                <div class="loading"></div>
            </button>

            <div style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #64748b; background: #f8fafc; padding: 0.6rem; border-radius: 8px;">
                <i class="fas fa-info-circle"></i> <strong>Acesso para Testes:</strong><br>Usuário: <code>admin</code> | Senha: <code>admin123</code>
            </div>
        </form>
        
        <footer class="login-footer">
            <p>&copy; 2026 Sabor Express Delivery</p>
        </footer>
    </div>

    <script>
        // Verificar se já está autenticado
        function checkAuth() {
            const isAuthenticated = sessionStorage.getItem('adminAuthenticated');
            if (isAuthenticated === 'true') {
                window.location.href = '../../admin.html';
                return true;
            }
            return false;
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            
            errorMessage.classList.remove('show');
            
            if (!username || !password) {
                showError('Preencha todos os campos!');
                return;
            }
            
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
            
            await new Promise(resolve => setTimeout(resolve, 600));
            
            // Validar credenciais flexíveis para demonstração
            if (username === 'admin' && (password === 'admin123' || password === 'pastelaria123' || password === 'admin' || password === '123456')) {
                sessionStorage.setItem('adminAuthenticated', 'true');
                sessionStorage.setItem('adminLoginTime', new Date().toISOString());
                window.location.href = '../../admin.html';
            } else {
                showError('Usuário ou senha incorretos!');
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        });

        // Mostrar erro
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        // Verificar autenticação ao carregar
        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAuth()) {
                // Focar no campo usuário
                document.getElementById('username').focus();
            }
        });

        // Impedir acesso direto via URL se não estiver autenticado
        if (window.location.pathname.includes('admin.html') && sessionStorage.getItem('adminAuthenticated') !== 'true') {
            window.location.href = '../../login.html';
        }
    </script>
</body>
</html>
